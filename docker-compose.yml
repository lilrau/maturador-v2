version: '3.8'

services:
  maturador:
    build: .
    container_name: maturador-v2
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
      - ./base64_media:/app/base64_media
    networks:
      - maturador-network

  nginx:
    image: nginx:alpine
    container_name: maturador-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - maturador
    restart: unless-stopped
    networks:
      - maturador-network

networks:
  maturador-network:
    driver: bridge

volumes:
  logs:
  media: 